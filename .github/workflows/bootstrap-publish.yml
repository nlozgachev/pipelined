name: Bootstrap First Release

on:
  workflow_dispatch:
    inputs:
      otp:
        description: "npm 6-digit 2FA code"
        required: true

permissions:
  contents: read
  id-token: write # Required for Sigstore provenance generation

jobs:
  publish:
    name: Bootstrap Publish to npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Configure npm authentication
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc

      - name: Publish to npm with Provenance and OTP
        run: npm publish --provenance --access public --otp=${{ inputs.otp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
