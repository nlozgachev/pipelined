name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format Check
        run: pnpm format:check

  typecheck:
    name: Typecheck (TS latest & TS 5.5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: Typecheck default (TS 6.x)
        run: pnpm typecheck
      - name: Typecheck min (TS 5.5)
        run: pnpm typecheck:min

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: Run Tests & Check Coverage
        run: pnpm test:coverage
