name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  stage-npm:
    name: Stage Publish to npm
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Check tag matches package.json version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Stage package on npm registry
        run: npm stage publish --provenance --access public

      - name: Output staging summary
        if: success()
        run: |
          PKG=$(node -e "console.log(require('./package.json').name)")
          VERSION=$(node -e "console.log(require('./package.json').version)")
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 📦 npm Staged Release: \`$PKG@$VERSION\`

          Package version was submitted to the npm staging queue with Sigstore provenance.

          #### Maintainer Promotion Required (2FA):
          Staged releases remain non-public until approved by a package maintainer.

          1. **Inspect staged package**:
             \`\`\`sh
             npm stage list $PKG
             npm stage view <stage-id>
             \`\`\`
          2. **Approve release (prompts for 2FA)**:
             \`\`\`sh
             npm stage approve <stage-id>
             \`\`\`
          3. **Web UI Approval**:
             Visit [\`npmjs.com/package/$PKG\`](https://www.npmjs.com/package/$PKG) under the **Staged Packages** tab.
          EOF
